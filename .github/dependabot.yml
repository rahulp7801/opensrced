version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      app-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /mcp-server
    schedule:
      interval: weekly
    groups:
      mcp-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 0.23+ changed the parser initialization/query API used by indexer.ts.
      - dependency-name: web-tree-sitter
        versions: [">=0.23.0"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      graph-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # graphifyy currently declares tree-sitter>=0.23,<0.26.
      - dependency-name: tree-sitter
        versions: [">=0.26.0"]
      # The production image is Python 3.11; NumPy 2.5 requires 3.12+.
      - dependency-name: numpy
        versions: [">=2.5.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      workflow-actions:
        patterns: ["*"]
