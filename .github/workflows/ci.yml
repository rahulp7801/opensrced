name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan complete Git history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v8.30.1 --repo gitleaks/gitleaks --dir "$RUNNER_TEMP/gitleaks" --pattern '*linux_x64.tar.gz' --pattern '*checksums.txt'
          cd "$RUNNER_TEMP/gitleaks"
          grep 'gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --log-opts=--all --redact=100

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # react-diff-viewer-continued has not declared React 19 support yet.
      - run: npm ci --legacy-peer-deps

      - name: Audit app dependencies
        run: npm audit --audit-level=high

      - name: Typecheck app
        run: npm run typecheck

      - name: Lint app
        run: npm run lint

      - name: Test
        run: npm test

      # Separate package, separate tsconfig and deps.
      - name: Build MCP server
        run: |
          cd mcp-server
          npm ci
          npm audit --audit-level=high
          npm run build
          node --test test/*.test.mjs

      - name: Verify restricted worker tools against the real CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/claude-runtime" --no-save @anthropic-ai/claude-code@2.1.269
          CLAUDE_BIN="$RUNNER_TEMP/claude-runtime/node_modules/.bin/claude" node scripts/smoke-worker-tools.mjs

      # The Next build needs an AUTH0_SECRET present to import lib/api-keys.
      # A throwaway value is fine — nothing is decrypted at build time.
      - name: Build
        run: npm run build
        env:
          AUTH0_SECRET: ci-build-only-not-a-real-secret
          APP_BASE_URL: http://localhost:3000
          AUTH0_DOMAIN: example.us.auth0.com
          AUTH0_CLIENT_ID: ci
          AUTH0_CLIENT_SECRET: ci

      - name: Install browser runtime
        run: npx playwright install --with-deps chromium

      - name: Production HTTP, browser, and concurrency smoke tests
        env:
          AUTH0_SECRET: ci-build-only-not-a-real-secret
          APP_BASE_URL: http://localhost:3100
          AUTH0_DOMAIN: example.us.auth0.com
          AUTH0_CLIENT_ID: ci
          AUTH0_CLIENT_SECRET: ci
        run: |
          npm start -- --port 3100 > "$RUNNER_TEMP/opensrcer.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3100/api/health > /dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke-production.mjs
          node scripts/smoke-session.mjs
          node scripts/smoke-browser.mjs
          node scripts/smoke-review.mjs
          node scripts/smoke-lists.mjs
          node scripts/smoke-graph-ui.mjs

  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-graph.txt
      - name: Install and audit graph runtime
        run: |
          python -m pip install -r requirements-graph.txt pip-audit==2.10.1
          python -m pip_audit -r requirements-graph.txt --no-deps --disable-pip
      - name: Build and validate a real graph
        run: node scripts/smoke-graph.mjs

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker build --tag opensrcer:ci .
      - name: Boot and smoke production image
        env:
          AUTH0_SECRET: ci-build-only-not-a-real-secret
          APP_BASE_URL: http://localhost:3000
          AUTH0_DOMAIN: example.us.auth0.com
          AUTH0_CLIENT_ID: ci
          AUTH0_CLIENT_SECRET: ci
        run: |
          docker run --detach --name opensrcer-ci --publish 127.0.0.1:3100:3000 \
            --env AUTH0_SECRET --env APP_BASE_URL --env AUTH0_DOMAIN \
            --env AUTH0_CLIENT_ID --env AUTH0_CLIENT_SECRET opensrcer:ci
          trap 'docker rm --force opensrcer-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3100/api/health > "$RUNNER_TEMP/container-health.json"; then break; fi
            sleep 1
          done
          node -e 'const h=require(process.argv[1]); if(h.status!=="ok") throw new Error(`container degraded: ${h.missing}`)' "$RUNNER_TEMP/container-health.json"
          docker exec --env SMOKE_BASE_URL=http://127.0.0.1:3000 opensrcer-ci node scripts/smoke-production.mjs
